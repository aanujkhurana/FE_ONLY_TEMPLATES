<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Aquatics | Premium Pool Architecture</title>
    <style>
      /* ─── INLINE LOADING STATE (renders before JS) ─── */
      html, body { margin: 0; background: #020b14; }
      /* fixed overlay covers the viewport regardless of #root layout */
      #loading-init {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 20px;
        background: #020b14;
        opacity: 1;
        transition: opacity 0.4s ease;
      }
      #loading-init.hidden { opacity: 0; pointer-events: none; }
      #loading-init-bar {
        width: 120px; height: 2px;
        background: rgba(255,255,255,0.06);
        border-radius: 2px; overflow: hidden;
      }
      #loading-init-bar-fill {
        height: 100%; width: 40%;
        background: linear-gradient(90deg,#00d4f0,#38bdf8);
        border-radius: 2px;
        animation: loadingSlide 1.4s ease-in-out infinite;
      }
      #loading-init-text {
        font-family: 'Inter',sans-serif;
        font-size: 11px; letter-spacing: 0.35em;
        text-transform: uppercase; color: rgba(255,255,255,0.3);
      }
      @keyframes loadingSlide {
        0%   { transform: translateX(-20%); width: 30%; }
        50%  { width: 60%; }
        100% { transform: translateX(120%); width: 30%; }
      }
    </style>
  </head>
  <body>
    <div id="loading-init">
      <div id="loading-init-text">Aura Aquatics</div>
      <div id="loading-init-bar"><div id="loading-init-bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script>
      window.__hideLoading = function() {
        var el = document.getElementById('loading-init');
        if (el) { el.classList.add('hidden'); }
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
