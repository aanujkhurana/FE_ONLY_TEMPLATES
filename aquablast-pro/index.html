<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
      rel="preload"
      as="image"
      href="/hero2-md.avif"
      imagesrcset="/hero2-sm.avif 600w, /hero2-md.avif 1000w, /hero2.avif 1600w"
      imagesizes="100vw"
      fetchpriority="high"
    />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aura Aquatics | Premium Pool Architecture</title>
    <style>
      /* ─── INLINE LOADING STATE (renders before JS) ─── */
      html, body { margin: 0; background: #020b14; }
      #root {
        opacity: 0;
        transform: translateY(10px);
        transition: opacity 0.65s cubic-bezier(0.16, 1, 0.3, 1), transform 0.65s cubic-bezier(0.16, 1, 0.3, 1);
      }
      html.site-ready #root {
        opacity: 1;
        transform: translateY(0);
      }
      /* fixed overlay covers the viewport regardless of #root layout */
      #loading-init {
        position: fixed; inset: 0; z-index: 9999;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
        gap: 20px;
        background:
          radial-gradient(circle at 50% 38%, rgba(0,212,240,0.09), transparent 34%),
          radial-gradient(circle at 50% 62%, rgba(200,169,110,0.06), transparent 30%),
          #020b14;
        opacity: 1;
        transition: opacity 0.55s cubic-bezier(0.16, 1, 0.3, 1);
      }
      #loading-init.hidden { opacity: 0; pointer-events: none; }
      #loading-init-mark {
        width: 54px; height: 54px;
        border-radius: 50%;
        border: 1px solid rgba(0,212,240,0.28);
        box-shadow: inset 0 0 24px rgba(0,212,240,0.1), 0 0 36px rgba(0,212,240,0.08);
        position: relative;
      }
      #loading-init-mark::after {
        content: "";
        position: absolute; inset: 13px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(168,239,255,0.9), rgba(0,212,240,0.16) 55%, transparent 56%);
        animation: loadingPulse 1.8s ease-in-out infinite;
      }
      #loading-init-bar {
        width: 148px; height: 2px;
        background: rgba(255,255,255,0.06);
        border-radius: 2px; overflow: hidden;
      }
      #loading-init-bar-fill {
        height: 100%; width: 40%;
        background: linear-gradient(90deg,#00d4f0,#38bdf8);
        border-radius: 2px;
        animation: loadingSlide 1.4s ease-in-out infinite;
      }
      #loading-init-text {
        font-family: 'Inter',sans-serif;
        font-size: 11px; letter-spacing: 0.35em;
        text-transform: uppercase; color: rgba(255,255,255,0.3);
      }
      #loading-init-subtext {
        font-family: 'Inter',sans-serif;
        font-size: 9px; letter-spacing: 0.28em;
        text-transform: uppercase; color: rgba(200,169,110,0.45);
        margin-top: -12px;
      }
      @keyframes loadingSlide {
        0%   { transform: translateX(-20%); width: 30%; }
        50%  { width: 60%; }
        100% { transform: translateX(120%); width: 30%; }
      }
      @keyframes loadingPulse {
        0%, 100% { transform: scale(0.82); opacity: 0.55; }
        50% { transform: scale(1); opacity: 1; }
      }
    </style>
  </head>
  <body>
    <div id="loading-init">
      <div id="loading-init-mark"></div>
      <div id="loading-init-text">Aura Aquatics</div>
      <div id="loading-init-subtext">Preparing Experience</div>
      <div id="loading-init-bar"><div id="loading-init-bar-fill"></div></div>
    </div>
    <div id="root"></div>
    <script>
      window.__hideLoading = function() {
        var el = document.getElementById('loading-init');
        document.documentElement.classList.add('site-ready');
        if (el) {
          el.classList.add('hidden');
          window.setTimeout(function() { el.remove(); }, 650);
        }
      };
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
