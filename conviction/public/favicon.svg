<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Rich Metallic Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9A7B1C" />
      <stop offset="25%" stop-color="#EAC775" />
      <stop offset="50%" stop-color="#BE963A" />
      <stop offset="75%" stop-color="#FDF1A9" />
      <stop offset="100%" stop-color="#A18120" />
    </linearGradient>
    
    <!-- Deep Outer Glow for Contrast -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Solid Premium Black Background -->
  <rect width="100%" height="100%" fill="#0D0D0D" />

  <!-- Central Logo Emblem -->
  <g transform="translate(250, 250)">
    
    <!-- Outer Geometric Rings -->
    <circle r="180" fill="none" stroke="url(#goldGrad)" stroke-width="2" opacity="0.4" />
    <circle r="165" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-dasharray="10 15" />
    <circle r="145" fill="none" stroke="url(#goldGrad)" stroke-width="3" />

    <!-- Interlocking Abstract Framework -->
    <g filter="url(#glow)">
      <!-- Sharp Golden Axis Points -->
      <path d="M 0,-145 L 10,-110 L -10,-110 Z" fill="url(#goldGrad)" />
      <path d="M 0,145 L 10,110 L -10,110 Z" fill="url(#goldGrad)" />
      <path d="M -145,0 L -110,10 L -110,-10 Z" fill="url(#goldGrad)" />
      <path d="M 145,0 L 110,10 L 110,-10 Z" fill="url(#goldGrad)" />

      <!-- Inner Sacred Geometry / Dynamic Nodes -->
      <path d="M -70,-70 L 70,-70 L 70,70 L -70,70 Z" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" transform="rotate(45)" />
      
      <!-- Core Stylized Shield / Monogram Core -->
      <path d="M 0,-85 
               C  45,-85  65,-60  65,-20 
               C  65,35   35,65    0,90 
               C -35,65  -65,35  -65,-20 
               C -65,-60 -45,-85   0,-85 Z" 
            fill="#0D0D0D" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" />

      <!-- Inner Sleek Ribbon Facets -->
      <path d="M -40,-35 C -20,-55 20,-55 40,-35 C 25,-20 -25,-20 -40,-35 Z" fill="url(#goldGrad)" />
      <path d="M 0,-15 L 45,25 C 30,50 0,65 0,65 C 0,65 -30,50 -45,25 Z" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
      
      <!-- Central Focus Anchor -->
      <polygon points="0,-35 25,15 -25,15" fill="url(#goldGrad)" />
      <circle r="6" fill="#0D0D0D" />
    </g>
    
  </g>
</svg>
